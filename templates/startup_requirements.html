<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta name="virtus-csrf" content="{{ session.get('csrf', '') }}">
  <script src="{{ url_for('static', filename='js/request_security.js') }}"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="virtus-startup-token" content="{{ startup_token }}" />
<title>Virtus · Setup Required</title>
<link rel="icon" href="{{ url_for('static', filename='virtus-logo-dark.png') }}" data-logo-dark="{{ url_for('static', filename='virtus-logo-dark.png') }}" data-logo-light="{{ url_for('static', filename='virtus-logo-light.png') }}" type="image/png" />
<link rel="shortcut icon" href="{{ url_for('static', filename='virtus-logo-dark.png') }}" data-logo-dark="{{ url_for('static', filename='virtus-logo-dark.png') }}" data-logo-light="{{ url_for('static', filename='virtus-logo-light.png') }}" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />
<script>
(function () {
  try {
    var prefs = JSON.parse(localStorage.getItem('virtus_customization') || '{}');
    var root = document.documentElement;
    var theme = prefs.theme || 'auto';
    if (theme === 'auto') theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    theme = theme === 'light' ? 'light' : 'dark';
    root.setAttribute('data-theme', theme);

    var hex = prefs.customAccentColor || prefs.accentColor || '#DDB37E';
    if (/^#[0-9a-f]{6}$/i.test(hex || '')) {
      var n = parseInt(hex.slice(1), 16);
      var rr = (n >> 16) & 255, gg = (n >> 8) & 255, bb = n & 255;
      if (theme === 'light') {
        rr = Math.round(rr * 0.86);
        gg = Math.round(gg * 0.86);
        bb = Math.round(bb * 0.86);
      }
      var rgb = rr + ',' + gg + ',' + bb;
      var accentHex = '#' + [rr,gg,bb].map(function(v){ return v.toString(16).padStart(2,'0'); }).join('');
      var lin = function(v){ v = v / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
      var lum = 0.2126 * lin(rr) + 0.7152 * lin(gg) + 0.0722 * lin(bb);
      root.style.setProperty('--accent', accentHex);
      root.style.setProperty('--accent-rgb', rgb);
      root.style.setProperty('--on-accent', lum > 0.20 ? '#201711' : '#fff7ea');
      root.style.setProperty('--accent-dim', 'rgba(' + rgb + ',0.12)');
      root.style.setProperty('--accent-hover', 'rgba(' + rgb + ',0.20)');
      root.style.setProperty('--accent-glow', 'rgba(' + rgb + ',0.06)');
      root.style.setProperty('--accent-border', 'rgba(' + rgb + ',0.4)');
      root.style.setProperty('--accent-border-dim', 'rgba(' + rgb + ',0.25)');
      root.style.setProperty('--accent-border-mid', 'rgba(' + rgb + ',0.50)');
    }
  } catch (e) {}
})();
</script>
<style>
  html, body { min-height: 100dvh; height: auto; overflow: auto; }
  body.setup-page {
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
  }
  .setup-wrap { width: min(460px, 100%); animation: fadeUp .2s ease both; }
  .setup-logo { justify-content: center; margin-bottom: 16px; }
  .setup-card {
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .setup-main { padding: 22px; }
  .setup-kicker {
    margin-bottom: 8px;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: .68rem;
    letter-spacing: .05em;
    text-transform: uppercase;
  }
  .setup-main h1 {
    margin: 0 0 12px;
    color: var(--text);
    font-size: 1.1rem;
    font-weight: 500;
  }
  .setup-main p {
    color: var(--text2);
    font-size: .82rem;
    line-height: 1.6;
  }
  #details {
    margin-top: 12px;
    max-height: 180px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--code-bg);
    color: var(--text2);
    padding: 10px 12px;
    font-family: var(--font-mono);
    font-size: .68rem;
    line-height: 1.45;
  }
  .setup-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding: 14px 22px;
    border-top: 1px solid var(--border);
  }
  @media (max-width: 520px) {
    body.setup-page { padding: 16px; }
    .setup-actions { flex-direction: column; }
  }
</style>
<script src="{{ url_for('static', filename='js/brand_assets.js') }}" defer></script>
</head>
<body class="setup-page">
  <main class="setup-wrap">
    <div class="logo setup-logo" aria-label="Virtus">
      <div class="logo-mark"><img class="brand-logo-dark" src="{{ url_for('static', filename='virtus-logo-dark.png') }}" alt="" /><img class="brand-logo-light" src="{{ url_for('static', filename='virtus-logo-light.png') }}" alt="" /></div>
      <span class="logo-name">Virtus</span>
    </div>

    <section class="setup-card" data-action="{{ status.action or '' }}">
      <div class="setup-main">
        <div class="setup-kicker">Setup required</div>
        <h1 id="title">{{ status.title }}</h1>
        <p id="message">{{ status.message }}</p>
        <pre id="details"{% if not status.details %} hidden{% endif %}>{{ status.details or '' }}</pre>
      </div>
      <div class="setup-actions">
        <button id="start-docker" class="btn-secondary" type="button">Start Docker</button>
        <button id="build" class="btn-primary" type="button">Install Virtus Tools</button>
        <button id="retry" class="btn-primary" type="button">Retry</button>
      </div>
    </section>
  </main>

<script>
const card = document.querySelector('.setup-card');
const title = document.getElementById('title');
const message = document.getElementById('message');
const details = document.getElementById('details');
const retry = document.getElementById('retry');
const build = document.getElementById('build');
const startDocker = document.getElementById('start-docker');
const startupToken = document.querySelector('meta[name="virtus-startup-token"]').content;
const startupHeaders = { 'X-Virtus-Startup-Token': startupToken };

function render(status) {
  if (status.ok) return location.reload();
  title.textContent = status.title || 'Setup required';
  message.textContent = status.message || 'Fix the requirement, then click Retry.';
  details.textContent = status.details || '';
  details.hidden = !status.details;
  build.hidden = status.action !== 'build';
  startDocker.hidden = status.action !== 'start_docker';
}

async function check() {
  const response = await fetch('/api/startup/requirements');
  render(await response.json());
}

async function startDockerDesktop() {
  startDocker.disabled = retry.disabled = true;
  startDocker.textContent = 'Starting Docker…';
  try {
    const response = await fetch('/api/startup/start-docker', {
      method: 'POST',
      credentials: 'same-origin',
      headers: startupHeaders,
    });
    const payload = await response.json();
    if (!response.ok) throw new Error(payload.error || payload.message || 'Docker could not be started');
    render(payload);
    for (let attempt = 0; attempt < 80; attempt += 1) {
      await new Promise(resolve => setTimeout(resolve, 1500));
      const statusResponse = await fetch('/api/startup/requirements');
      const status = await statusResponse.json();
      render(status);
      if (status.ok || status.code !== 'docker_not_running') break;
    }
  } catch (error) {
    render({
      title: 'Docker could not be started',
      message: 'Open Docker Desktop manually, then click Retry.',
      details: error.message,
      action: 'retry',
    });
  } finally {
    startDocker.disabled = retry.disabled = false;
    startDocker.textContent = 'Start Docker';
  }
}

function processBuildEvent(block) {
  let eventType = 'message';
  const dataLines = [];
  for (const line of block.split(/\r?\n/)) {
    if (line.startsWith('event:')) eventType = line.slice(6).trim();
    if (line.startsWith('data:')) dataLines.push(line.slice(5).trimStart());
  }
  if (!dataLines.length) return false;

  const payload = JSON.parse(dataLines.join('\n'));
  if (eventType === 'log') {
    details.appendChild(document.createTextNode(String(payload.line || '').slice(-8192) + '\n'));
    while (details.childNodes.length > 50) details.firstChild.remove();
    details.scrollTop = details.scrollHeight;
    return false;
  }
  if (eventType === 'done' || eventType === 'error') {
    render(payload);
    return true;
  }
  return false;
}

async function buildImage() {
  build.disabled = retry.disabled = true;
  build.textContent = 'Installing…';
  details.hidden = false;
  details.textContent = '';

  try {
    const response = await fetch('/api/startup/build-sandbox-image/stream', {
      method: 'POST',
      credentials: 'same-origin',
      headers: {
        ...startupHeaders,
        Accept: 'text/event-stream',
      },
    });
    if (!response.ok) {
      const payload = await response.json().catch(() => ({}));
      throw new Error(payload.error || 'Virtus Tools installation was refused');
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let terminalEvent = false;
    while (true) {
      const { value, done } = await reader.read();
      buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
      let boundary;
      while ((boundary = buffer.indexOf('\n\n')) !== -1) {
        terminalEvent = processBuildEvent(buffer.slice(0, boundary)) || terminalEvent;
        buffer = buffer.slice(boundary + 2);
      }
      if (done) break;
    }
    if (buffer.trim()) terminalEvent = processBuildEvent(buffer) || terminalEvent;
    if (!terminalEvent) throw new Error('The installation stream ended unexpectedly');
  } catch (error) {
    render({
      title: 'Build failed',
      message: 'Virtus Tools could not be installed. Reload this page before trying again.',
      details: error.message,
      action: 'retry',
    });
  } finally {
    build.disabled = retry.disabled = false;
    build.textContent = 'Install Virtus Tools';
  }
}

retry.addEventListener('click', check);
build.addEventListener('click', buildImage);
startDocker.addEventListener('click', startDockerDesktop);
build.hidden = card.dataset.action !== 'build';
startDocker.hidden = card.dataset.action !== 'start_docker';
</script>
</body>
</html>
