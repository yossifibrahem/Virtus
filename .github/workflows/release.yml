name: Release desktop alpha

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v
        required: true
        default: 0.1.0-alpha.1
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            value="${GITHUB_REF_NAME#v}"
          else
            value="${INPUT_VERSION}"
          fi
          echo "value=${value}" >> "${GITHUB_OUTPUT}"

  sandbox:
    needs: metadata
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - id: sandbox-identity
        name: Compute sandbox input identity
        shell: bash
        run: echo "value=$(python3 -c 'import build_info; print(build_info.sandbox_identity())')" >> "${GITHUB_OUTPUT}"

      - name: Build and verify first-run sandbox image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sandbox
          platforms: ${{ matrix.platform }}
          load: true
          tags: virtus-sandbox:latest
          build-args: VIRTUS_SANDBOX_IDENTITY=${{ steps.sandbox-identity.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test sandbox runtime
        run: python3 packaging/smoke_sandbox.py --image virtus-sandbox:latest

  macos:
    needs: [metadata, sandbox]
    runs-on: macos-14
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-desktop.txt

      - name: Run tests
        run: pytest

      - name: Import optional Developer ID certificate
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          echo "${MACOS_CERTIFICATE_P12}" | base64 --decode > "${RUNNER_TEMP}/certificate.p12"
          security create-keychain -p actions "${RUNNER_TEMP}/virtus.keychain-db"
          security set-keychain-settings -lut 21600 "${RUNNER_TEMP}/virtus.keychain-db"
          security unlock-keychain -p actions "${RUNNER_TEMP}/virtus.keychain-db"
          security import "${RUNNER_TEMP}/certificate.p12" \
            -P "${MACOS_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 \
            -k "${RUNNER_TEMP}/virtus.keychain-db"
          security list-keychain -d user -s "${RUNNER_TEMP}/virtus.keychain-db"

      - name: Build Apple Silicon DMG
        env:
          VIRTUS_BUILD_VERSION: ${{ needs.metadata.outputs.version }}
          VIRTUS_BUILD_NUMBER: ${{ github.run_number }}
        run: packaging/build_macos.sh

      - name: Smoke-test frozen app without system Python
        env:
          VIRTUS_DESKTOP_SMOKE_TEST: "1"
          VIRTUS_DESKTOP_NO_BROWSER: "1"
        run: "dist/Virtus AI Chat.app/Contents/MacOS/Virtus AI Chat"

      - name: Notarize when Apple credentials are configured
        if: env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != '' && env.MACOS_SIGN_IDENTITY != ''
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          dmg="dist/Virtus-AI-Chat-${VERSION}-apple-silicon.dmg"
          xcrun notarytool submit "${dmg}" \
            --apple-id "${APPLE_ID}" \
            --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_APP_PASSWORD}" \
            --wait
          xcrun stapler staple "${dmg}"
          filename="$(basename "${dmg}")"
          cd dist
          shasum -a 256 "${filename}" > "${filename}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: Virtus-AI-Chat-${{ needs.metadata.outputs.version }}-apple-silicon
          path: |
            dist/*.dmg
            dist/*.sha256

      - name: Attach files to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.sha256
          generate_release_notes: true

  windows:
    needs: [metadata, sandbox]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-desktop.txt

      - name: Run tests
        run: pytest

      - name: Build and smoke-test Windows x64 onedir package
        env:
          VIRTUS_BUILD_VERSION: ${{ needs.metadata.outputs.version }}
          VIRTUS_BUILD_NUMBER: ${{ github.run_number }}
        shell: pwsh
        run: .\packaging\build_windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: Virtus-AI-Chat-${{ needs.metadata.outputs.version }}-windows-x64
          path: |
            dist/*-windows-x64.zip
            dist/*-windows-x64.zip.sha256

      - name: Attach files to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*-windows-x64.zip
            dist/*-windows-x64.zip.sha256
          generate_release_notes: true
